[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "touhou07"
version = "0.1.0"
description = "通用东方弹幕游戏框架; TH07《东方妖妖梦》为首个接入作品/参考实现"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow>=10.0",
    "pygame",
    "loguru",
    "msgspec",
    "pyfiglet>=1.0.4",
]

[project.scripts]
touhou07 = "touhou.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["touhou"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py310"
# old/ 是 gitignored 的旧仓参考资料, 不扫
extend-exclude = ["old"]

[tool.ruff.lint]
# E402 随 E 启用(导入必须顶部); UP 配 py310 自动抓 Optional(UP045)等旧式写法
select = ["E", "F", "I", "UP", "D"]
# docstring 只查风格不查有无: 不强制每个公开成员都写(D1xx 全放),
# 写了就必须是合格 Google 风格(D2xx-D4xx 按 convention 收)。
# D415 豁免: 中文 docstring 以"。"收尾, ruff 只认 ASCII 句读。
# E501 豁免: CJK 按 2 倍宽度计数, 88 列对中文注释/文档太紧, 行长交给 formatter。
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D415", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
# 宽松渐进档: 未注解的函数不强制补签名(allow_untyped_defs), 但函数体照查
# (check_untyped_defs), 并抓明显错误(Any 泄漏返回/无效忽略/冗余 cast/松相等)。
allow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

# pygame 渲染层豁免: 大量 `self.x = None` 延迟初始化 + 界面流程状态机 union
# 是刻意写法, mypy 对 pygame stub 也常有噪音; 该层由全量测试(SDL dummy)兜底。
# engine.view.* = 通用渲染基建; games.th07/th08.view.* = 作品表现层(同一豁免档)。
[[tool.mypy.overrides]]
module = ["touhou.engine.view.*", "touhou.games.th07.view.*", "touhou.games.th08.view.*"]
ignore_errors = true

# 测试目录豁免: pytest 驱动, 构造夹具时有意打破类型(鸭子类型替身等)。
[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true
